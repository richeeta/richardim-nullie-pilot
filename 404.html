<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <title>404 — Richard Hyunho Im</title>
    <script>
      (() => {
        const saved = localStorage.getItem('rhi-theme');
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <main class="hero error-hero shell">
      <div class="hero-copy">
        <p class="eyebrow">404 / Boundary not found</p>
        <h1>This path doesn&rsquo;t trust <em>anything.</em></h1>
        <p class="hero-deck">The resource moved, vanished, or never existed.</p>
        <div class="hero-actions">
          <a class="button button-primary" href="/">Return home <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </main>
  </body>
</html>
